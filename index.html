<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Radio log.</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Radio log.">
  <style>
    :root {
      --bg-color: #faf4f5;
      --card-bg: #ffffff;
      --text-main: #2d2327;
      --text-muted: #8c7b80;
      --accent-dark: #3a2e33;
      --accent-pink: #f5e6eb;
      --border-color: #f0e1e6;
    }

    body { 
      background-color: var(--bg-color); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
      color: var(--text-main);
      margin: 0; 
      padding: 30px; 
      padding-bottom: 120px;
      -webkit-tap-highlight-color: transparent;
    }
    .radio-container { max-width: 650px; margin: 0 auto; }
    
    /* ヘッダーエリア */
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1.main-title { 
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      color: var(--text-main); 
      margin: 0; 
      font-size: 2.3rem; 
      letter-spacing: -0.5px;
      cursor: pointer;
      user-select: none;
    }
    
    /* 右上の更新ボタン */
    .refresh-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--accent-dark);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: transform 0.2s;
    }
    .refresh-btn:active {
      transform: rotate(180deg);
    }

    /* タブ切り替えボタンエリア */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      overflow-x: auto;
      padding-bottom: 5px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }

    .tab-btn.active {
      background: var(--accent-dark);
      color: #ffffff;
      border-color: var(--accent-dark);
      box-shadow: 0 4px 10px rgba(58, 46, 51, 0.2);
    }

    .radio-section { display: none; }
    .radio-section.active-section { display: block; }

    /* カード全体の余白と枠 */
    details { 
      background: var(--card-bg); 
      border-radius: 24px; 
      padding: 25px 30px; 
      margin-bottom: 25px; 
      box-shadow: 0 4px 15px rgba(58, 46, 51, 0.03); 
      border: 1px solid var(--border-color);
    }
    
    summary { 
      font-weight: 600; 
      color: var(--accent-dark); 
      padding: 5px 10px; 
      cursor: pointer; 
      outline: none; 
      list-style: none; 
      font-size: 1.3rem; 
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: '▾'; font-size: 1.2rem; color: var(--text-muted); }
    
    .card-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 18px 10px; 
      border-top: 1px solid var(--border-color); 
      margin-top: 15px;
    }
    
    .date { 
      font-size: 1.1rem; 
      color: var(--text-main); 
      font-weight: 600; 
      background: var(--bg-color);
      padding: 6px 14px;
      border-radius: 12px;
    }
    
    .x-btn { 
      background-color: var(--accent-dark); 
      color: white; 
      text-decoration: none; 
      width: 42px; 
      height: 42px; 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 1.1rem; 
      font-weight: bold;
      flex-shrink: 0; 
      transition: opacity 0.2s;
      box-shadow: 0 2px 6px rgba(58, 46, 51, 0.2);
    }
    .x-btn:hover { opacity: 0.8; }

    /* 管理者パネル */
    .admin-panel {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(58, 46, 51, 0.05);
      border: 1px solid var(--border-color);
      display: none;
    }
    .admin-mode .admin-panel { display: block; }

    .admin-panel h3 { color: var(--accent-dark); margin-top: 0; font-size: 1.2rem; display: flex; justify-content: space-between; align-items: center;}
    .logout-text-btn { font-size: 0.8rem; color: var(--text-muted); cursor: pointer; text-decoration: underline; }
    
    .form-row { margin-bottom: 12px; }
    .form-row input, .form-row select {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      border-radius: 14px;
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      color: var(--text-main);
    }
    .submit-btn {
      background: var(--accent-dark);
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 削除ボタン（管理者モード時のみ項目の横に小さく出る用） */
    .delete-item-btn {
      background: #e6c5cc;
      color: var(--accent-dark);
      border: none;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 10px;
    }
    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body id="body-root">

<div class="radio-container">
  <div class="header-area">
    <!-- タイトル「Radio log.」を5回連続タップで管理者ログイン -->
    <h1 class="main-title" id="secret-title">Radio log.</h1>
    <button class="refresh-btn" onclick="location.reload()" title="更新">🔄</button>
  </div>

  <!-- タブ切り替えボタン -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('fuma', this)">菊池風磨 hoursz</button>
    <button class="tab-btn" onclick="switchTab('shori', this)">レコメン❤️🎽</button>
    <button class="tab-btn" onclick="switchTab('shino', this)">…＆シノ！from timelesz</button>
  </div>

  <!-- 管理者用：新規追加パネル -->
  <div class="admin-panel">
    <h3>
      <span>＋ 新しい回を追加</span>
      <span class="logout-text-btn" onclick="logoutAdmin()">ログアウト</span>
    </h3>
    <div class="form-row">
      <select id="add-target">
        <option value="fuma">菊池風磨 hoursz</option>
        <option value="shori">レコメン❤️🎽</option>
        <option value="shino">…＆シノ！from timelesz</option>
      </select>
    </div>
    <div class="form-row">
      <input type="text" id="add-yearmonth" placeholder="表示する年月 (例: 2026年 8月)">
    </div>
    <div class="form-row">
      <input type="text" id="add-date" placeholder="日付 (例: 26.08.30)">
    </div>
    <div class="form-row">
      <input type="text" id="add-url" placeholder="X (Twitter) のURL">
    </div>
    <button class="submit-btn" onclick="addNewRadio()">追加を保存する</button>
  </div>

  <!-- 各セクション (JavaScriptで自動描画されます) -->
  <div id="section-fuma" class="radio-section active-section"></div>
  <div id="section-shori" class="radio-section"></div>
  <div id="section-shino" class="radio-section"></div>

</div>

<script>
  // デフォルトデータ（初めて開いた時、またはデータがない場合の初期値）
  const defaultData = {
    fuma: {
      "2026年 8月": [
        { date: "26.08.23", url: "https://x.com/tokyofm/status/2091339640762704035?s=46" },
        { date: "26.08.16", url: "https://x.com/tokyofm/status/2088802925573185931?s=46" },
        { date: "26.08.09", url: "https://x.com/tokyofm/status/2086266210598129724?s=46" }
      ]
    },
    shori: {
      "2026年 8月": [
        { date: "26.08.20", url: "https://x.com/" }
      ]
    },
    shino: {
      "2026年 8月": [
        { date: "26.08.18", url: "https://x.com/" }
      ]
    }
  };

  // ローカルストレージからデータを読み込み（なければデフォルト）
  let radioData = JSON.parse(localStorage.getItem("oshi_radio_data")) || defaultData;

  function saveData() {
    localStorage.setItem("oshi_radio_data", JSON.stringify(radioData));
  }

  // 画面を描画する関数
  function renderAll() {
    ['fuma', 'shori', 'shino'].forEach(target => {
      const sectionEl = document.getElementById("section-" + target);
      const months = radioData[target] || {};
      
      let html = "";
      for (const [ym, items] of Object.entries(months)) {
        html += `<details open><summary>${ym}</summary>`;
        items.forEach((item, index) => {
          html += `
            <div class="card-item">
              <span class="date">${item.date}</span>
              <div class="item-right">
                <a href="${item.url}" target="_blank" class="x-btn">𝕏</a>
                ${isAdmin ? `<button class="delete-item-btn" onclick="deleteItem('${target}', '${ym}',${index})">削除</button>` : ''}
              </div>
            </div>
          `;
        });
        html += `</details>`;
      }
      sectionEl.innerHTML = html;
    });
  }

  let isAdmin = sessionStorage.getItem("oshi_radio_admin") === "true";

  function updateAdminUI() {
    const body = document.getElementById("body-root");
    if (isAdmin) {
      body.classList.add("admin-mode");
    } else {
      body.classList.remove("admin-mode");
    }
    renderAll();
  }

  // 隠し管理者ログイン（左上の「Radio log.」を5回連続タップ）
  let touchCount = 0;
  let touchTimer = null;
  const titleEl = document.getElementById("secret-title");

  titleEl.addEventListener("click", () => {
    touchCount++;
    clearTimeout(touchTimer);
    
    if (touchCount >= 5) {
      triggerAdminLogin();
      touchCount = 0;
    } else {
      touchTimer = setTimeout(() => {
        touchCount = 0;
      }, 800);
    }
  });

  function triggerAdminLogin() {
    if (!isAdmin) {
      const pwd = prompt("管理者パスワードを入力してください：");
      if (pwd === "fuma123") {
        isAdmin = true;
        sessionStorage.setItem("oshi_radio_admin", "true");
        updateAdminUI();
        alert("管理者モードを有効化しました");
      } else if (pwd !== null) {
        alert("パスワードが違います");
      }
    }
  }

  function logoutAdmin() {
    isAdmin = false;
    sessionStorage.removeItem("oshi_radio_admin");
    updateAdminUI();
    alert("ログアウトしました");
  }

  function switchTab(targetSection, element) {
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    element.classList.add("active");

    document.querySelectorAll(".radio-section").forEach(sec => sec.classList.remove("active-section"));
    document.getElementById("section-" + targetSection).classList.add("active-section");
  }

  function addNewRadio() {
    const target = document.getElementById("add-target").value;
    const ym = document.getElementById("add-yearmonth").value.trim();
    const date = document.getElementById("add-date").value.trim();
    const url = document.getElementById("add-url").value.trim();

    if (!ym || !date || !url) {
      alert("すべての項目を入力してください！");
      return;
    }

    if (!radioData[target]) {
      radioData[target] = {};
    }
    if (!radioData[target][ym]) {
      radioData[target][ym] = [];
    }

    // 新しいものを先頭に追加
    radioData[target][ym].unshift({ date, url });
    saveData();
    renderAll();

    document.getElementById("add-yearmonth").value = "";
    document.getElementById("add-date").value = "";
    document.getElementById("add-url").value = "";
    alert("新しいラジオを追加して保存しました！");
  }

  function deleteItem(target, ym, index) {
    if (confirm("この記録を削除しますか？")) {
      radioData[target][ym].splice(index, 1);
      if (radioData[target][ym].length === 0) {
        delete radioData[target][ym];
      }
      saveData();
      renderAll();
    }
  }

  // 初期描画
  updateAdminUI();
</script>

</body>
</html>
