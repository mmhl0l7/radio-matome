  function addNewItem() {
    const dateInput = document.getElementById("input-date").value.trim();
    const titleInput = document.getElementById("input-title").value.trim();
    const urlInput = document.getElementById("input-url").value.trim();

    if (!dateInput || !titleInput || !urlInput) {
      alert("すべての項目を入力してください！");
      return;
    }

    // 日付から年月を自動判定 (例: "26.08.23" または "2026.08.23" から年月を作る)
    let yearPart = "2026";
    let monthPart = "1";
    
    if (dateInput.startsWith("25.")) {
      yearPart = "2025";
      monthPart = parseInt(dateInput.substring(3, 5), 10);
    } else if (dateInput.startsWith("26.")) {
      yearPart = "2026";
      monthPart = parseInt(dateInput.substring(3, 5), 10);
    } else if (dateInput.length >= 4) {
      // 2026.08 などに対応
      const parts = dateInput.split(/[\.\-\/]/);
      if (parts.length >= 2) {
        yearPart = parts[0].length === 2 ? "20" + parts[0] : parts[0];
        monthPart = parseInt(parts[1], 10);
      }
    }

    const targetYearMonth = `${yearPart}年 ${monthPart}月`;

    // 該当する年月のグループを探す、なければ新しく作る
    let group = radioData.find(g => g.yearMonth === targetYearMonth);
    if (!group) {
      group = { yearMonth: targetYearMonth, items: [] };
      radioData.unshift(group); // リストの先頭に追加
    }

    group.items.unshift({ date: dateInput, title: titleInput, url: urlInput });

    saveToStorage();
    renderList();

    // フォームをクリアして閉じる
    document.getElementById("input-date").value = "";
    document.getElementById("input-title").value = "";
    document.getElementById("input-url").value = "";
    document.getElementById("admin-form").classList.remove("show");
    alert("新しい放送回を追加しました！");
  }

  function deleteItem(ymIndex, itemIndex) {
    if (!isAdminLoggedIn) return;
    if (confirm("この項目を削除しますか？")) {
      radioData[ymIndex].items.splice(itemIndex, 1);
      //もしグループのitemsが空になったらグループ自体を削除
      if (radioData[ymIndex].items.length === 0) {
        radioData.splice(ymIndex, 1);
      }
      saveToStorage();
      renderList();
    }
  }

  function renderList() {
    const container = document.getElementById("radio-list-container");
    container.innerHTML = "";

    radioData.forEach((group, ymIndex) => {
      const details = document.createElement("details");
      // 一番最初の月（最新）は最初から開いておくなどの演出も可能ですが、お好みで open 属性をつけられます
      if (ymIndex === 0) details.setAttribute("open", "true");

      const summary = document.createElement("summary");
      summary.textContent = group.yearMonth;
      details.appendChild(summary);

      group.items.forEach((item, itemIndex) => {
        const cardItem = document.createElement("div");
        cardItem.className = "card-item";
        cardItem.innerHTML = `
          <a href="${item.url}" target="_blank" class="info">
            <span class="date">${item.date}</span>
            <span class="title">${item.title}</span>
          </a>
          <a href="${item.url}" target="_blank" class="x-btn">𝕏</a>
          <button class="admin-delete-btn" onclick="deleteItem(${ymIndex}, ${itemIndex})" title="削除">×</button>
        `;
        details.appendChild(cardItem);
      });

      container.appendChild(details);
    });
  }

  // 初期描画
  applyAdminUI();
</script>

</body>
</html>
