<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📻 推しラジオ管理ダッシュボード</title>
  <style>
    :root {
      --bg-color: #f7f3f5;
      --card-bg: #ffffff;
      --primary: #6d4c41; /* 上品なブラウン/モーヴ系 */
      --primary-light: #d7ccc8;
      --accent: #bcaaa4;
      --text-main: #3e2723;
      --text-sub: #8d6e63;
      --border-radius: 20px;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
      padding-bottom: 120px;
      color: var(--text-main);
    }

    .container {
      max-width: 750px;
      margin: 0 auto;
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .app-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
      margin: 0;
    }

    .app-subtitle {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-top: 5px;
    }

    /* 上部タブ切り替え (画像のようなピル型ナビ) */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: #eef2f5;
      border: none;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #3e2723;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(62, 39, 35, 0.2);
    }

    /* 新規追加エリア (管理モード時のみ表示) */
    .add-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 25px;
      margin-bottom: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
      border: 1px solid rgba(0,0,0,0.04);
      display: none;
    }
    .admin-mode .add-card { display: block; }

    .add-card h3 {
      font-size: 1.2rem;
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--text-main);
    }

    .form-row {
      margin-bottom: 15px;
    }

    .form-row input, .form-row select, .form-row textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      font-size: 1rem;
      box-sizing: border-box;
      outline: none;
      background: #fafafa;
      transition: border 0.2s;
    }

    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      border-color: var(--text-main);
      background: #fff;
    }

    .submit-btn {
      background: var(--text-main);
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.9; }

    /* リスト項目カード (画像のデザインを踏襲) */
    .radio-card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 20px 24px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.03);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.15s;
      border: 1px solid rgba(0,0,0,0.02);
    }

    .radio-card:hover {
      transform: translateY(-2px);
    }

    .radio-info {
      flex: 1;
      text-decoration: none;
      display: flex;
      flex-direction: column;
    }

    .meta-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 6px;
    }

    /* ラジオ番組タグ */
    .badge-shori { background: #ffebee; color: #c62828; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .badge-fuma { background: #f3e5f5; color: #7b1fa2; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
    .badge-shino { background: #e3f2fd; color: #1565c0; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }

    .card-date {
      font-size: 0.85rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .card-title {
      font-size: 1.15rem;
      color: var(--text-main);
      font-weight: 500;
      line-height: 1.4;
    }

    /* アクションボタン (Xリンク & 削除) */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 15px;
    }

    .x-link-btn {
      background: #f0f0f0;
      color: #333;
      text-decoration: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .x-link-btn:hover { background: #e0e0e0; }

    .delete-btn {
      display: none;
      background: none;
      border: none;
      color: #e57373;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 5px;
    }
    .admin-mode .delete-btn { display: block; }

    /* 管理者フッター */
    .footer-admin {
      text-align: center;
      margin-top: 40px;
    }

    .admin-toggle-btn {
      background: none;
      border: 1px solid #d7ccc8;
      color: var(--text-sub);
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      font-weight: 600;
    }
    .admin-toggle-btn.logged-in {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
    }
  </style>
</head>
<body id="body-root">

<div class="container">
  <!-- ヘッダー -->
  <div class="header">
    <div>
      <h1 class="app-title">Radio log.</h1>
      <div class="app-subtitle">推しラジオのアーカイブ管理表</div>
    </div>
  </div>

  <!-- タブ切り替えボタン -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('ALL', this)">ALL すべて</button>
    <button class="tab-btn" onclick="switchTab('FUMA', this)">💜 菊池風磨</button>
    <button class="tab-btn" onclick="switchTab('SHORI', this)">❤️ 勝利 / 原</button>
    <button class="tab-btn" onclick="switchTab('SHINO', this)">💙 しの</button>
  </div>

  <!-- 新規追加フォーム（管理者モードでのみ表示） -->
  <div class="add-card">
    <h3>＋ 新しい放送回を追加</h3>
    <div class="form-row">
      <select id="input-category">
        <option value="FUMA">菊池風磨</option>
        <option value="SHORI">勝利 / 原</option>
        <option value="SHINO">しの</option>
      </select>
    </div>
    <div class="form-row">
      <input type="text" id="input-date" placeholder="日付 (例: 26.08.30)">
    </div>
    <div class="form-row">
      <textarea id="input-title" rows="2" placeholder="タイトル・内容を入力"></textarea>
    </div>
    <div class="form-row">
      <input type="text" id="input-url" placeholder="X (Twitter) のリンクURL">
    </div>
    <button class="submit-btn" onclick="addNewRadioItem()">タスクを追加する</button>
  </div>

  <!-- リスト表示エリア -->
  <div id="radio-list"></div>

  <!-- 管理者ログイン切り替え -->
  <div class="footer-admin">
    <button class="admin-toggle-btn" id="admin-toggle-btn" onclick="toggleAdmin()">⚙️ 管理者ログイン</button>
  </div>
</div>

<script>
  // 初期データ（サンプル）
  const initialRadioData = [
    { id: 1, category: "FUMA", date: "26.08.23", title: "夏の思い出と最近の近況トーク", url: "https://x.com/tokyofm/status/2091339640762704035?s=46" },
    { id: 2, category: "FUMA", date: "26.08.16", title: "お盆休みの過ごし方とメッセージ", url: "https://x.com/tokyofm/status/2088802925573185931?s=46" },
    { id: 3, category: "SHORI", date: "26.08.20", title: "勝利＆原コンビで最近のプライベート語り", url: "https://x.com/" },
    { id: 4, category: "SHINO", date: "26.08.18", title: "しののラジオ：まったり近況雑談回", url: "https://x.com/" }
  ];

  let radioData = [];
  const savedData = localStorage.getItem("oshi_radio_data_v2");
  if (savedData) {
    try { radioData = JSON.parse(savedData); } catch (e) { radioData = initialRadioData; }
  } else {
    radioData = initialRadioData;
    saveData();
  }

  let currentFilter = "ALL";
  let isAdmin = sessionStorage.getItem("oshi_radio_admin") === "true";

  function saveData() {
    localStorage.setItem("oshi_radio_data_v2", JSON.stringify(radioData));
  }

  function updateAdminUI() {
    const body = document.getElementById("body-root");
    const btn = document.getElementById("admin-toggle-btn");
    if (isAdmin) {
      body.classList.add("admin-mode");
      btn.textContent = "⚙️ 管理者ログアウト";
      btn.classList.add("logged-in");
    } else {
      body.classList.remove("admin-mode");
      btn.textContent = "⚙️ 管理者ログイン";
      btn.classList.remove("logged-in");
    }
    renderList();
  }

  function toggleAdmin() {
    if (!isAdmin) {
      const pwd = prompt("管理者パスワードを入力してください：");
      if (pwd === "fuma123") {
        isAdmin = true;
        sessionStorage.setItem("oshi_radio_admin", "true");
        alert("管理者モードを有効化しました");
      } else if (pwd !== null) {
        alert("パスワードが違います");
        return;
      }
    } else {
      if (confirm("ログアウトしますか？")) {
        isAdmin = false;
        sessionStorage.removeItem("oshi_radio_admin");
        alert("ログアウトしました");
      }
    }
    updateAdminUI();
  }

  function switchTab(category, element) {
    currentFilter = category;
    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
    element.classList.add("active");
    renderList();
  }

  function addNewRadioItem() {
    const category = document.getElementById("input-category").value;
    const date = document.getElementById("input-date").value.trim();
    const title = document.getElementById("input-title").value.trim();
    const url = document.getElementById("input-url").value.trim();

    if (!date || !title || !url) {
      alert("すべての項目を入力してください！");
      return;
    }

    const newItem = {
      id: Date.now(),
      category,
      date,
      title,
      url
    };

    radioData.unshift(newItem);
    saveData();
    renderList();

    // フォームクリア
    document.getElementById("input-date").value = "";
    document.getElementById("input-title").value = "";
    document.getElementById("input-url").value = "";
    alert("追加しました！");
  }

  function deleteItem(id) {
    if (!isAdmin) return;
    if (confirm("この項目を削除しますか？")) {
      radioData = radioData.filter(item => item.id !== id);
      saveData();
      renderList();
    }
  }

  function getBadgeHTML(category) {
    if (category === "FUMA") return `<span class="badge-fuma">菊池風磨</span>`;
    if (category === "SHORI") return `<span class="badge-shori">勝利 / 原</span>`;
    if (category === "SHINO") return `<span class="badge-shino">しの</span>`;
    return "";
  }

  function renderList() {
    const container = document.getElementById("radio-list");
    container.innerHTML = "";

    const filtered = currentFilter === "ALL" 
      ? radioData 
      : radioData.filter(item => item.category === currentFilter);

    if (filtered.length === 0) {
      container.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 30px;">データがありません</div>`;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "radio-card";
      card.innerHTML = `
        <a href="${item.url}" target="_blank" class="radio-info">
          <div class="meta-row">
            ${getBadgeHTML(item.category)}
            <span class="card-date">${item.date}</span>
          </div>
          <div class="card-title">${item.title}</div>
        </a>
        <div class="card-actions">
          <a href="${item.url}" target="_blank" class="x-link-btn" title="Xを開く">𝕏</a>
          <button class="delete-btn" onclick="deleteItem(${item.id})" title="削除">🗑️</button>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 初期化
  updateAdminUI();
</script>

</body>
</html>
